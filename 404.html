<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page introuvable | Ponyscope</title>
    <meta name="robots" content="noindex">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background: #fafafa;
            color: #222;
        }
        h1 {
            font-size: 8rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: #555;
        }
        a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        a:hover { background: #444; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Cette page n'existe pas.</p>
    <a href="/">Retour à l'accueil</a>
</body>
</html>
